spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
        pool:
          max-idle-time: 5000
          max-life-time: 60000
          acquire-timeout: 45000
          max-connections: 1000
          max-per-route: 100
        compression: true

      routes:
        # ==================== REQUEST SERVICE ====================
        - id: request_service_route
          uri: lb://REQUEST-SERVICE
          predicates:
            - Path=/users/{userId}/requests/**, /public/events/{eventId}/requests/**, /internal/requests/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                methods: POST,PUT,PATCH,DELETE
                backoff:
                  firstBackoff: 50
                  maxBackoff: 500
                  factor: 2
            # 🔥 Убираем RequestTimeout - его нет!
            # Вместо этого используем глобальный response-timeout

        # ==================== USER SERVICE ====================
        - id: user_service_route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/admin/users/**, /public/users/**, /internal/users/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                methods: POST,PUT,PATCH,DELETE
                backoff:
                  firstBackoff: 50
                  maxBackoff: 500
                  factor: 2

        # ==================== EVENT SERVICE ====================
        - id: event_service_route
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/admin/events/**, /admin/categories/**, /admin/compilations/**, /events/**, /categories/**, /compilations/**, /users/{userId}/events/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                methods: POST,PUT,PATCH,DELETE
                backoff:
                  firstBackoff: 50
                  maxBackoff: 500
                  factor: 2

        # ==================== COMMENT SERVICE ====================
        - id: comment_service_route
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/admin/comments/**, /events/{eventId}/comments/**, /users/{userId}/comments/**, /internal/comments/**, /comments/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                methods: POST,PUT,PATCH,DELETE
                backoff:
                  firstBackoff: 50
                  maxBackoff: 500
                  factor: 2

        # ==================== STATS SERVICE ====================
        - id: stats_service_route
          uri: lb://STATS-SERVER
          predicates:
            - Path=/hit, /stats/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: POST
                backoff:
                  firstBackoff: 50
                  maxBackoff: 500
                  factor: 2

server:
  port: 8080

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, info, metrics
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: WARN
    org.springframework.http.server.reactive: WARN
    reactor.netty: WARN