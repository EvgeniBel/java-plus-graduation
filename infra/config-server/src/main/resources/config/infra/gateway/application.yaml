server:
  port: 8080
cloud:
  gateway:
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true
    routes:
      - id: main_service_route
        uri: lb://MAIN-SERVICE
        predicates:
          - Path=/api/v1/**
        filters:
          - StripPrefix=1

      - id: stats_service_route
        uri: lb://STATS-SERVER
        predicates:
          - Path=/stats-server/**
        filters:
          - PrefixPath=/api/v1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always