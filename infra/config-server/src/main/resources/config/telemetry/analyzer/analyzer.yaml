server:
  port: 8090

spring:
  application:
    name: analyzer
  cloud:
    config:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5439/analyzer_db
    username: analyzer_user
    password: analyzer_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analyzer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.avro.deserializer.AvroDeserializer
      properties:
        value.deserializer.class: ru.practicum.ewm.stats.avro.UserActionAvro
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100


grpc:
  server:
    port: 9091

kafka:
  topics:
    user-actions: user-actions-topic
    events-similarity: events-similarity-topic

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"

logging:
  level:
    ru.practicum.analyzer: DEBUG
    org.springframework.kafka: INFO
    com.netflix.discovery: DEBUG