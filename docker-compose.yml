services:
  postgres-stats:
    image: postgres:15
    container_name: postgres-stats
    environment:
      POSTGRES_DB: ewm-stats-server
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5434:5432"
    volumes:
      - postgres-stats-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network

  postgres-event:
    image: postgres:15
    container_name: postgres-event
    environment:
      POSTGRES_DB: ewm-event-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5435:5432"
    volumes:
      - postgres-event-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network

  postgres-comment:
    image: postgres:15
    container_name: postgres-comment
    environment:
      POSTGRES_DB: ewm-comment-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5436:5432"
    volumes:
      - postgres-comment-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network

  postgres-request:
    image: postgres:15
    container_name: postgres-request
    environment:
      POSTGRES_DB: ewm-request-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5437:5432"
    volumes:
      - postgres-request-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network

  postgres-user:
    image: postgres:15
    container_name: postgres-user
    environment:
      POSTGRES_DB: ewm-user-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5438:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network

  postgres-analyzer:
    image: postgres:15
    container_name: postgres-analyzer
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: analyzer_user
      POSTGRES_PASSWORD: analyzer_password
    ports:
      - "5439:5432"
    volumes:
      - postgres-analyzer-data:/var/lib/postgresql/data
      - ./telemetry/analyzer/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - ewm-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - ewm-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    restart: unless-stopped
    networks:
      - ewm-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8085:8080"
    restart: unless-stopped
    networks:
      - ewm-network

volumes:
  postgres-stats-data:
  postgres-event-data:
  postgres-comment-data:
  postgres-request-data:
  postgres-user-data:
  postgres-analyzer-data:

networks:
  ewm-network:
    driver: bridge