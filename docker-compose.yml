      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres-ewm-user-service -d ewm-user-service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-main-data:
  postgres-stats-data:
  postgres-event-data:
  postgres-comment-data:
  postgres-request-data:
  postgres-user-data: