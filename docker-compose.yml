      test: ["CMD-SHELL", "pg_isready -U postgres-ewm-comment-service -d ewm-comment-service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-request:
    image: postgres:15
    container_name: postgres-request
    environment:
      POSTGRES_DB: ewm-request-service
      POSTGRES_USER: postgres-ewm-request-service
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - postgres-request-data:/var/lib/postgresql/data
