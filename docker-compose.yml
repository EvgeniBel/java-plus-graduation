services:
  postgres-stats:
    image: postgres:15
    container_name: postgres-stats
    environment:
      POSTGRES_DB: ewm-stats-server
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5434:5432"
    volumes:
      - postgres-stats-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ewm -d ewm-stats-server" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-event:
    image: postgres:15
    container_name: postgres-event
    environment:
      POSTGRES_DB: ewm-event-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5435:5432"
    volumes:
      - postgres-event-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ewm -d ewm-event-service" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-comment:
    image: postgres:15
    container_name: postgres-comment
    environment:
      POSTGRES_DB: ewm-comment-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5436:5432"
    volumes:
      - postgres-comment-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ewm -d ewm-comment-service" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-request:
    image: postgres:15
    container_name: postgres-request
    environment:
      POSTGRES_DB: ewm-request-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5437:5432"
    volumes:
      - postgres-request-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ewm -d ewm-request-service" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:15
    container_name: postgres-user
    environment:
      POSTGRES_DB: ewm-user-service
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    ports:
      - "5438:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ewm -d ewm-user-service" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-analyzer:
    image: postgres:15
    container_name: postgres-analyzer
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: analyzer_user
      POSTGRES_PASSWORD: analyzer_password
    ports:
      - "5439:5432"
    volumes:
      - postgres-analyzer-data:/var/lib/postgresql/data
      - ./telemetry/analyzer/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U analyzer_user -d analyzer_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # KAFKA в KRaft режиме (БЕЗ Zookeeper)
  # =============================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # ✅ Добавить эти настройки:
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # ✅ Увеличить таймауты:
      KAFKA_OFFSET_COMMIT_TIMEOUT_MS: 10000
      KAFKA_OFFSET_COMMIT_REQUIRED_ACKS: -1
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - ewm-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # ✅ Добавить лимиты ресурсов:
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  postgres-stats-data:
  postgres-event-data:
  postgres-comment-data:
  postgres-request-data:
  postgres-user-data:
  postgres-analyzer-data:
  kafka_data:

networks:
  ewm-network:
    driver: bridge