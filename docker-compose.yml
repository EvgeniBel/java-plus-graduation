      retries: 5
    restart: unless-stopped

  postgres-comment:
    image: postgres:15
    container_name: postgres-comment
    environment:
      POSTGRES_DB: ewm-comment-service
      POSTGRES_USER: postgres-ewm-comment-service
      POSTGRES_PASSWORD: password
