spring:
  application:
    name: collector-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1

kafka:
  topics:
    user-actions: user-actions-topic

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics