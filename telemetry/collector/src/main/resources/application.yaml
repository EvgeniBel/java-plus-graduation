spring:
  application:
    name: collector
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1

grpc:
  server:
    port: 0

kafka:
  topics:
    user-actions: stats.user-actions.v1

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics