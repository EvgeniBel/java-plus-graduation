syntax = "proto3";

package stats.service.collector;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

enum ActionTypeProto {
    ACTION_UNKNOWN = 0;
    ACTION_VIEW = 1;
    ACTION_REGISTER = 2;
    ACTION_LIKE = 3;
}

message UserActionProto {
    int64 user_id = 1;
    int64 event_id = 2;
    ActionTypeProto action_type = 3;
    string timestamp = 4;
}

message Empty {}

service UserActionController {
    rpc CollectUserAction (UserActionProto) returns (Empty);
}