syntax = "proto3";

package telemetry.common;

option java_multiple_files = true;
option java_package = "ru.practicum.telemetry.common";

message ErrorInfo {
    string code = 1;
    string message = 2;
    repeated string details = 3;
}

message OperationStatus {
    bool success = 1;
    string message = 2;
    ErrorInfo error = 3;
}

message PaginationRequest {
    int32 page = 1;
    int32 size = 2;
}

message PaginationResponse {
    int32 total = 1;
    int32 page = 2;
    int32 size = 3;
    int32 total_pages = 4;
}

enum SortDirection {
    SORT_UNSPECIFIED = 0;
    SORT_ASC = 1;
    SORT_DESC = 2;
}

message SortField {
    string field = 1;
    SortDirection direction = 2;
}