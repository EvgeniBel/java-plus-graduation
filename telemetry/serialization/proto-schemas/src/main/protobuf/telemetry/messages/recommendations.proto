syntax = "proto3";

package telemetry.messages;

option java_multiple_files = true;
option java_package = "ru.practicum.telemetry.messages";

message UserPredictionsRequest {
    int64 user_id = 1;
    int32 max_results = 2;
}

message SimilarEventsRequest {
    int64 event_id = 1;
    int64 user_id = 2;
    int32 max_results = 3;
}

message InteractionsCountRequest {
    repeated int64 event_ids = 1;
}

message RecommendedEvent {
    int64 event_id = 1;
    double score = 2;
}